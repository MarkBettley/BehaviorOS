schema: spec-driven

context: |
  Tech stack: Docker Compose + Supabase local (Postgres 15, GoTrue, PostgREST, Storage, Kong, Studio, imgproxy)
  Architecture: Modular level-based roadmap (Nivel 0.x infrastructure -> 1.x auth -> 2.x backend -> 3.x frontend -> 4.x AI/commerce)
  Testing: No test runner configured at Nivel 0.2; health checks via bash/curl/docker
  Style: Bash scripts; infrastructure-as-code via Docker Compose; docs in Sdd/specs/

strict_tdd: false

rules:
  proposal:
    - Include rollback plan for risky infrastructure changes
    - Identify affected containers, volumes, and environment variables
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Never modify Nivel 1.1+ features inside Nivel 0.2 infrastructure deliverables
  verify:
    - Run ./scripts/healthcheck.sh for infrastructure verification
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: false
  detected: 2026-08-17
  runner:
    command: ""
    framework: NOT FOUND
  layers:
    unit:
      available: false
      tool: "—"
    integration:
      available: false
      tool: "—"
    e2e:
      available: false
      tool: "—"
  coverage:
    available: false
    command: "—"
  quality_tools:
    linter:
      available: false
      command: "—"
    type_checker:
      available: false
      command: "—"
    formatter:
      available: false
      command: "—"
