# ------------------------------------------------------------
# VALIDACIONES AUTOMÁTICAS (Para el CI/CD y el BQAS)
# ------------------------------------------------------------
validation_rules:
  - rule: "Todos los servicios deben tener health checks configurados."
    check: "El validador verifica la presencia de endpoints /health en cada servicio."
  - rule: "Los backups deben realizarse automáticamente al menos una vez al día."
    check: "El validador verifica la configuración de backups programados."
  - rule: "El sistema debe poder escalar horizontalmente (múltiples réplicas)."
    check: "El validador verifica que los servicios sean stateless y escalables."
  - rule: "Todas las comunicaciones externas deben estar cifradas (TLS 1.3)."
    check: "El validador verifica la configuración de TLS en todos los dominios."
  - rule: "Los secretos no deben estar en el código; deben ser inyectados desde un gestor de secretos."
    check: "El validador verifica que los secretos no estén hardcodeados."

