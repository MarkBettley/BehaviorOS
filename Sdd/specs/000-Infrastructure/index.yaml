# ============================================================
# BehavioralOS - Specification Driven Development
# Module: 000-Infrastructure
# Version: 1.0.0
# Status: Stable
# ============================================================
# PROPÓSITO:
# Este módulo define la selección de infraestructura y motores
# del BehavioralOS, priorizando opciones gratuitas y open source
# para el desarrollo y las primeras fases de producción.
#
# CONTENIDO:
#   1. selection.md   → Selección de herramientas gratuitas y plan de migración
#
# IMPORTANCIA:
# La elección de infraestructura es crítica para el costo y la
# escalabilidad del proyecto. Este módulo guía la selección de
# herramientas, evitando costos innecesarios en las fases iniciales
# y planificando la migración a versiones de pago cuando sea necesario.
# ============================================================

module:
  id: 000-Infrastructure
  name: "Infraestructura y Selección Tecnológica"
  version: 1.0.0
  status: Stable
  owner: "Arquitectura de Software & DevOps"
  last_updated: 2026-07-13
  description: >
    Define la selección de infraestructura y motores del BehavioralOS,
    priorizando opciones gratuitas y open source para el desarrollo
    y las primeras fases de producción. Incluye un plan de migración
    a versiones de pago cuando el proyecto crezca.

# ------------------------------------------------------------
# DEPENDENCIAS
# ------------------------------------------------------------
depends_on:
  - id: 000-Core
    reason: "La filosofía y los principios guían las decisiones de infraestructura."

# ------------------------------------------------------------
# ARCHIVOS HIJOS (Especificaciones concretas)
# ------------------------------------------------------------
children:
  - id: INF-001
    file: selection.md
    title: "Selección de Infraestructura y Motores"
    description: >
      Documento que analiza todas las herramientas y motores del
      ecosistema, priorizando opciones gratuitas y open source.
      Incluye la justificación de cada elección, los límites de
      las versiones gratuitas, y un plan de migración a versiones
      de pago cuando el proyecto crezca. Solo Stripe, Mercado Pago
      y Facturapi se consideran herramientas de pago sin alternativa
      gratuita viable.
    priority: P0
    estimated_read_time: 20 min
    exports:
      - "Estrategia de selección de tecnologías gratuitas/open source"
      - "Tabla de equivalencias: motor de paga → alternativa gratuita"
      - "Límites y condiciones de las versiones gratuitas"
      - "Plan de migración a versiones de paga"

# ------------------------------------------------------------
# EXPORTACIONES (Qué ofrece este módulo al resto)
# ------------------------------------------------------------
exports:
  - concept:
      name: "Estrategia de Infraestructura"
      description: "Selección de herramientas gratuitas y plan de migración"
      used_by: [Todos los módulos, DevOps, Desarrollo]

# ------------------------------------------------------------
# METADATOS PARA EL CLI Y AGENTES DE IA
# ------------------------------------------------------------
ai_context:
  reading_profile: "Infraestructura y DevOps"
  required_for:
    - "Configuración de herramientas gratuitas"
    - "Planificación de migración a herramientas de pago"
    - "Selección de tecnologías"
  tokens_estimate: 500
  embedding_tags:
    - "infraestructura"
    - "herramientas-gratuitas"
    - "open-source"
    - "migracion"
    - "costos"

# ------------------------------------------------------------
# HISTORIAL DE CAMBIOS (Versionado semántico)
# ------------------------------------------------------------
history:
  - version: 1.0.0
    date: 2026-07-13
    author: "Arquitectura de Software"
    changes:
      - "Creación inicial del módulo de Infraestructura."
      - "Definición del archivo selection.md como único hijo."