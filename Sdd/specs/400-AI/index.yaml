  - concept:
      name: "Compañero Terapéutico (TCCN)"
      description: "IA conversacional con personalidad clínica"
      used_by: [Patient App, Therapist App, AHEE]
  - concept:
      name: "Evaluación Adaptativa (AAO)"
      description: "Evaluación continua y multimodal del paciente"
      used_by: [Behavioral Twin, BERL, TCCN, MPO, AHEE]
  - concept:
      name: "Guardrails + Crisis Interceptor"
      description: "Filtros de seguridad, crisis y cumplimiento normativo"
      used_by: [TCCN, AAO, RAG, BCGS, Patient App]
  - concept:
      name: "Conocimiento Científico (BKGE + BSC)"
      description: "Grafo de conocimiento y base de evidencia científica"
      used_by: [RAG, AAO, BERL, TCCN, BIP, BROS]
  - concept:
      name: "Event Sourcing (7 Motores Derivados)"
      description: "Arquitectura de eventos para procesamiento asíncrono"
      used_by: [Backend, Panel Terapeuta, Analytics]
  - concept:
      name: "Soporte y Atención por IA (AI-007)"
      description: "Canal de soporte para reporte de errores y mejoras"
      used_by: [Landing (SLS-001), Patient App, Therapist App, Soporte]

# ------------------------------------------------------------
# VALIDACIONES AUTOMÁTICAS (Para el CI/CD y el BQAS)
# ------------------------------------------------------------
validation_rules:
  - rule: "Toda respuesta de la IA debe pasar por el pipeline de guardrails."
    check: "Las pruebas de integración verifican que cada salida de IA sea validada."
  - rule: "El Crisis Interceptor debe detectar ideación suicida con >99% recall."
    check: "Evaluación clínica con conjunto de pruebas de crisis."
  - rule: "El AAO debe actualizar el Behavioral Twin después de cada evaluación."
    check: "Las pruebas de integración verifican la actualización del Twin."
  - rule: "El TCCN debe alinearse con la ontología y el vocabulario controlado."
    check: "Las pruebas de unidad verifican el lenguaje contra el vocabulario."
  - rule: "El BKGE debe mantener trazabilidad científica."
    check: "El validador verifica versiones de conocimiento."
  - rule: "El Event Stream debe procesar >99% de eventos exitosamente."
    check: "Monitoreo de procesamiento de motores derivados."
  - rule: "El streaming SSE debe mantener latencia <200ms."
    check: "Métricas de backend para latencia de primera respuesta."
  - rule: "El Support Chat (AI-007) no debe atender contenido comercial ni terapéutico."
    check: "Las pruebas de integración verifican que los intents commercial/therapeutic se redirigen y no se resuelven."
  - rule: "Todo ticket de soporte con datos personales debe tener consentimiento en consent_log."
    check: "Pruebas de integración verifican consent_log antes de persistir datos de diagnóstico."

