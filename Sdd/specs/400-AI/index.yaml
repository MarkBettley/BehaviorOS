# ============================================================
# BehavioralOS - Specification Driven Development
# Module: 400-AI
# Version: 2.2.0
# Status: Stable
# ============================================================
# PROPÓSITO:
# Este módulo define todos los motores de inteligencia artificial
# del BehavioralOS. Alberga los sistemas de IA que permiten la
# personalización, la conversación terapéutica, la evaluación
# adaptativa, el razonamiento clínico, la recuperación de
# conocimiento y el procesamiento de eventos. Es el cerebro
# cognitivo del ecosistema.
#
# CONTENIDO:
#   1. ai-core.md               → Gemma + MediaPipe on-device + Streaming SSE
#   2. companion.md             → TCCN (compañero terapéutico)
#   3. adaptive-orchestrator.md → AAO (evaluación adaptativa continua)
#   4. guardrails.md            → Guardrails + Crisis Interceptor
#   5. rag-knowledge-graph.md   → BSC + BKGE (conocimiento científico)
#   6. event-sourcing-ai.md     → Event Stream + 7 motores derivados (NUEVO)
#   7. ai-007-support.md        → Soporte y atención por IA (support chat, NUEVO)
#
# IMPORTANCIA:
# La IA es el diferenciador clave del BehavioralOS. Gemma con
# MediaPipe ofrece inferencia on-device con constrained decoding JSON,
# el Crisis Interceptor protege la vida del paciente, y el
# event-sourcing habilita 7 motores derivados que procesan
# eventos conductuales de forma asíncrona y tolerante a fallos.
# ============================================================

module:
  id: 400-AI
  name: "Inteligencia Artificial y Motores Cognitivos"
  version: 2.2.0
  status: Stable
  implementation_level: 3
  implementation_status: "Frozen — esperar a Nivel 2. Nota: AI-007 queda ESPECIFICADO para planning (status: Specified); la implementación del módulo sigue congelada hasta Nivel 2."
  owner: "IA & Ciencia de Datos"
  last_updated: 2026-08-12
  description: >
    Define todos los motores de inteligencia artificial del BehavioralOS:
    inferencia on-device (Gemma + MediaPipe con constrained decoding),
    companion terapéutico (TCCN), evaluación adaptativa (AAO),
    guardrails clínicos con Crisis Interceptor, conocimiento
    científico (BSC + BKGE), arquitectura de eventos con 7
    motores derivados (RFT, ACT, FAP, BPG, Twin, BXE, BARS),
    y soporte y atención por IA (AI-007) para reporte de errores
    y propuestas de mejora.

# ------------------------------------------------------------
# DEPENDENCIAS
# ------------------------------------------------------------
depends_on:
  - id: 000-Core
    reason: "La ontología, los principios y el vocabulario guían el comportamiento de la IA."
  - id: 100-Architecture
    reason: "La arquitectura define cómo la IA se integra con el resto del sistema."
  - id: 200-Backend
    reason: "Las APIs, eventos y Redis Streams permiten que la IA se comunique."
  - id: 300-Frontend
    reason: "La IA interactúa con el usuario a través de la PWA (SSE streaming)."

# ------------------------------------------------------------
# ARCHIVOS HIJOS (Especificaciones concretas)
# ------------------------------------------------------------
children:
  - id: AI-001
    file: ai-core.md
    title: "Motor de Inferencia IA On-Device (Gemma + MediaPipe)"
    description: >
      Define el núcleo de la IA: Gemma como modelo principal
      ejecutado on-device via MediaPipe, con constrained
      decoding JSON, function calling para eventos clínicos,
      prompt versioning, shadow deployments y pipeline de
      streaming SSE completo. Basado en AI Engineering (Chip Huyen).
    priority: P0
    estimated_read_time: 25 min
    exports:
      - "Arquitectura de inferencia on-device: Gemma + MediaPipe"
      - "Constrained Decoding JSON"
      - "Function Calling clínico"
      - "Prompt versioning y shadow deployments"
      - "Pipeline de streaming SSE"

  - id: AI-002
    file: companion.md
    title: "Compañero Terapéutico (TCCN)"
    description: >
      Define el Therapeutic Cognitive Companion Network (TCCN),
      la IA conversacional que acompaña al paciente con personalidad
      estable, tono clínico y adaptación al perfil del usuario.
    priority: P0
    estimated_read_time: 25 min
    exports:
      - "Personalidad y tono del compañero"
      - "Estructura de diálogo y tipos de mensajes"
      - "Integración con Behavioral Twin y AAO"

  - id: AI-003
    file: adaptive-orchestrator.md
    title: "Orquestador de Evaluación Adaptativa (AAO)"
    description: >
      Define el AAO, el sistema de evaluación continua, multimodal
      e idiográfica con Confidence Engine y selección adaptativa
      de evidencia.
    priority: P0
    estimated_read_time: 25 min
    exports:
      - "Fuentes de evidencia y multimodalidad"
      - "Confidence Engine"
      - "Selección adaptativa de evidencia"

  - id: AI-004
    file: guardrails.md
    title: "Guardrails Clínicos, Seguridad y Crisis Interceptor"
    description: >
      Define el sistema de guardrails con Crisis Interceptor
      (filtro regex + clasificación semántica para ideación suicida),
      protocolo de contención, bloqueo de gamificación en crisis,
      notificación al psicólogo, cumplimiento FDA/EU MDR/AI Act
      y human-in-the-loop obligatorio.
    priority: P0
    estimated_read_time: 25 min
    exports:
      - "Crisis Interceptor (regex + semántica)"
      - "Protocolo de contención"
      - "Cumplimiento FDA y EU MDR/AI Act"
      - "Human-in-the-loop obligatorio"
      - "Pipeline de guardrails completo"

  - id: AI-005
    file: rag-knowledge-graph.md
    title: "Conocimiento Científico (BSC + BKGE)"
    description: >
      Define el BKGE (grafo de conocimiento semántico) y el BSC
      (capa de conocimiento científico agregado) para RAG e investigación.
    priority: P0
    estimated_read_time: 25 min
    exports:
      - "Estructura del BKGE"
      - "Integración con RAG"
      - "Behavioral Science Cloud"

  - id: AI-006
    file: event-sourcing-ai.md
    title: "Event Sourcing para Procesamiento de IA"
    description: >
      Define la arquitectura de eventos para procesamiento de IA:
      Event Stream como System of Record, 7 motores derivados
      (RFT Engine, ACT Hexaflex, FAP CRB, BPG Updater, Twin Updater,
      BXE Processor, BARS Aggregator), Redis Streams, FastAPI
      BackgroundTasks, Database Views como contrato público y
      patrón Strangler Fig para migración incremental.
    priority: P0
    estimated_read_time: 25 min
    exports:
      - "Event Stream como System of Record"
      - "7 motores derivados"
      - "Redis Streams como bus de eventos"
      - "Database Views como contrato público"
      - "Patrón Strangler Fig"

  - id: AI-007
    file: ai-007-support.md
    title: "Soporte y Atención por IA (Support Chat)"
    description: >
      Define el canal de soporte por IA para reporte de errores y
      propuestas de mejora, presente en la landing (SLS-001) y las
      apps. Corre sobre el runtime on-device de AI-001 (Gemma +
      MediaPipe, streaming SSE desde el dispositivo), clasifica
      intents (error/improvement), persiste tickets en
      support_tickets, registra consentimiento
      en consent_log y cumple guardrails (AI-004) y event sourcing
      (AI-006). Sin inferencia en navegador (no WebGPU/ONNX) ni en servidor privado.
    priority: P1
    estimated_read_time: 20 min
    exports:
      - "Canal de soporte por IA (errores y mejoras)"
      - "Clasificación de intents (soporte vs. TCCN)"
      - "Flujo de tickets y escalamiento"
      - "Registro de consentimiento de diagnóstico"
      - "Integración con guardrails y event sourcing"

# ------------------------------------------------------------
# EXPORTACIONES (Qué ofrece este módulo al resto)
# ------------------------------------------------------------
