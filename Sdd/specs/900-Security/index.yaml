# ============================================================
# BehavioralOS - Specification Driven Development
# Module: 900-Security
# Version: 1.0.0
# Status: Stable
# ============================================================
# PROPÓSITO:
# Este módulo define el Behavioral Security Operating System
# (BSOS), la capa de seguridad, identidad, permisos,
# consentimientos, cifrado y auditoría del BehavioralOS.
# Garantiza que el sistema sea seguro, privado, ético y
# cumpla con las regulaciones aplicables (LFPDPPP, GDPR,
# HIPAA, etc.).
#
# CONTENIDO:
#   1. security.md   → BSOS: identidad, permisos, consentimientos,
#                      cifrado, auditoría, cumplimiento normativo
#
# IMPORTANCIA:
# La seguridad no es un complemento; es la base sobre la que
# se construye toda la confianza del ecosistema. Los pacientes
# confían sus datos más íntimos, los terapeutas confían la
# práctica clínica, y la plataforma debe proteger esa confianza
# con los más altos estándares.
# ============================================================

module:
  id: 900-Security
  name: "Seguridad y Gobernanza"
  version: 1.0.0
  status: Stable
  owner: "Seguridad & Cumplimiento Normativo"
  last_updated: 2026-07-01
  description: >
    Define el Behavioral Security Operating System (BSOS),
    que gestiona la identidad, los permisos, los consentimientos,
    el cifrado, la auditoría y el cumplimiento normativo del
    BehavioralOS. Es la capa de confianza y protección del
    ecosistema.

# ------------------------------------------------------------
# DEPENDENCIAS
# ------------------------------------------------------------
depends_on:
  - id: 000-Core
    reason: "Los principios y la ontología guían las políticas de seguridad y privacidad."
  - id: 100-Architecture
    reason: "La arquitectura define la integración de la seguridad con el resto del sistema."
  - id: 200-Backend
    reason: "Las bases de datos y APIs implementan las políticas de seguridad (RLS, cifrado)."
  - id: 300-Frontend
    reason: "Las interfaces de usuario deben cumplir con las políticas de privacidad y consentimiento."

# ------------------------------------------------------------
# ARCHIVOS HIJOS (Especificaciones concretas)
# ------------------------------------------------------------
children:
  - id: BSOS-001
    file: security.md
    title: "Behavioral Security Operating System (BSOS)"
    description: >
      Define el sistema de seguridad y gobernanza del BehavioralOS:
      identidad y autenticación (JWT, OAuth, WebAuthn, 2FA),
      autorización (RBAC + ABAC + ReBAC, RLS), consentimientos
      granulares (BCPOS), cifrado (AES-256, TLS 1.3), auditoría
      inmutable, cumplimiento normativo (LFPDPPP, GDPR, HIPAA),
      y gestión de incidentes de seguridad. Es la capa de
      confianza del ecosistema.
    priority: P0
    estimated_read_time: 35 min
    exports:
      - "Identidad y autenticación"
      - "Autorización (RBAC, ABAC, ReBAC, RLS)"
      - "Consentimientos granulares (BCPOS)"
      - "Cifrado y protección de datos"
      - "Auditoría y trazabilidad"
      - "Cumplimiento normativo"
      - "Gestión de incidentes de seguridad"

# ------------------------------------------------------------
# EXPORTACIONES (Qué ofrece este módulo al resto)
# ------------------------------------------------------------
exports:
  - concept:
      name: "Identidad y Autenticación"
      description: "JWT, OAuth, WebAuthn, 2FA para acceso seguro"
      used_by: [Todos los módulos, Patient App, Therapist App]
  - concept:
      name: "Autorización (RBAC/ABAC/ReBAC/RLS)"
      description: "Control de acceso basado en roles, atributos, relaciones y RLS en PostgreSQL"
      used_by: [Todos los módulos, Backend, Frontend]
  - concept:
      name: "Consentimientos Granulares (BCPOS)"
      description: "Consentimiento explícito, reversible y auditado para cada tipo de dato"
      used_by: [Patient App, Therapist App, AAO, TCCN, BSC]
  - concept:
      name: "Cifrado y Protección de Datos"
      description: "AES-256 en reposo, TLS 1.3 en tránsito, cifrado de extremo a extremo"
      used_by: [Backend, Database, Storage]
  - concept:
      name: "Auditoría y Trazabilidad"
      description: "Registro inmutable de todas las acciones críticas"
      used_by: [BCGS, BPOS, BCE, Admin Dashboard]
  - concept:
      name: "Cumplimiento Normativo"
      description: "LFPDPPP, GDPR, HIPAA y otras regulaciones aplicables"
      used_by: [BCGS, Legal, Administración]
  - concept:
      name: "Gestión de Incidentes de Seguridad"
      description: "Detección, respuesta y recuperación ante incidentes de seguridad"
      used_by: [Admin Dashboard, DevOps, Seguridad]

# ------------------------------------------------------------
# VALIDACIONES AUTOMÁTICAS (Para el CI/CD y el BQAS)
# ------------------------------------------------------------
validation_rules:
  - rule: "Todas las comunicaciones deben usar TLS 1.3."
    check: "Las pruebas de seguridad verifican el uso de TLS 1.3 en todas las conexiones."
  - rule: "Los datos sensibles (clínicos, financieros, identificables) deben estar cifrados en reposo."
    check: "El validador verifica que los campos sensibles estén cifrados en la base de datos."
  - rule: "Todos los usuarios deben autenticarse con 2FA (opcional para pacientes, obligatorio para terapeutas)."
    check: "Las pruebas de autenticación verifican la disponibilidad de 2FA."
  - rule: "Los consentimientos deben ser granulares y reversibles."
    check: "El validador verifica que cada consentimiento pueda ser revocado individualmente."
  - rule: "Todas las acciones críticas deben quedar registradas en el sistema de auditoría."
    check: "Las pruebas de auditoría verifican que las acciones críticas generen registros."

# ------------------------------------------------------------
# METADATOS PARA EL CLI Y AGENTES DE IA
# ------------------------------------------------------------
ai_context:
  reading_profile: "Seguridad y Cumplimiento"
  required_for:
    - "Implementación de autenticación y autorización"
    - "Configuración de cifrado y protección de datos"
    - "Diseño de flujos de consentimiento"
    - "Configuración de auditoría y cumplimiento normativo"
  tokens_estimate: 3500
  embedding_tags:
    - "seguridad"
    - "identidad"
    - "autenticación"
    - "autorización"
    - "consentimiento"
    - "cifrado"
    - "auditoría"
    - "cumplimiento"
    - "rgpd"
    - "hipaa"
    - "lfpdppp"

# ------------------------------------------------------------
# HISTORIAL DE CAMBIOS (Versionado semántico)
# ------------------------------------------------------------
history:
  - version: 1.0.0
    date: 2026-07-01
    author: "Arquitectura de Seguridad"
    changes:
      - "Creación inicial del módulo de Seguridad."
      - "Definición del archivo security.md (BSOS)."
      - "Establecimiento de dependencias, exportaciones y reglas de validación."