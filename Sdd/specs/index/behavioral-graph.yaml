  - source: BAS-001  # automation-studio
    target: EVT-001
    type: "depends_on"
  - source: BAS-001
    target: BPOS-001
    type: "depends_on"
  - source: BAS-001
    target: BCE-001
    type: "depends_on"
  - source: BAS-001
    target: BIP-001
    type: "depends_on"
  - source: BAS-001
