    type: "depends_on"

  # BPO → BPE y 000-Core
  - source: BPO-001
    target: BPE-001
    type: "depends_on"
  - source: BPO-001
    target: ONT-001
    type: "depends_on"

  # BPG → BPO y 100-Architecture
  - source: BPG-001
    target: BPO-001
    type: "depends_on"
  - source: BPG-001
    target: BEA-001  # system-architecture
    type: "depends_on"
  - source: BPG-001
    target: DM-001   # data-model
    type: "depends_on"

  # BXE → BPG y 400-AI
  - source: BXE-001
    target: BPG-001
    type: "depends_on"
  - source: BXE-001
    target: AI-001   # ai-core
    type: "depends_on"
  - source: BXE-001
    target: AI-004   # guardrails
    type: "depends_on"

  # BIK → todos los motores (documento unificador)
  - source: BIK-001
    target: BPE-001
    type: "depends_on"
  - source: BIK-001
    target: BPO-001
    type: "depends_on"
  - source: BIK-001
    target: BPG-001
    type: "depends_on"
  - source: BIK-001
    target: BXE-001
