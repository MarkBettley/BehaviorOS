    type: "depends_on"
  - source: BIK-001
    target: API-001
    type: "depends_on"
  - source: BIK-001
    target: AI-001
    type: "depends_on"
  - source: BIK-001
    target: BERL-001  # experience-engine
    type: "depends_on"

  # BCMS → 100-Architecture y 200-Backend
  - source: BCMS-001
    target: BEA-001
    type: "depends_on"
  - source: BCMS-001
    target: DB-001
    type: "depends_on"
  - source: BCMS-001
    target: API-001
    type: "depends_on"

  # BCIE → BCMS (hijo del BCMS)
  - source: BCIE-001
    target: BCMS-001
    type: "depends_on"
  - source: BCIE-001
    target: AI-001
    type: "depends_on"
  - source: BCIE-001
    target: BPG-001
    type: "depends_on"

  # BCOE → BCMS (hijo del BCMS)
  - source: BCOE-001
    target: BCMS-001
    type: "depends_on"
  - source: BCOE-001
    target: BCE-001   # business-model
    type: "depends_on"

  # BSI → BCIE (submotor del BCIE)
