    target: BCIE-001
    type: "depends_on"
  - source: BSI-001
    target: BCMS-001
    type: "depends_on"
  - source: BSI-001
    target: BPG-001
    type: "depends_on"

  # ============================================================
  # Dependencias del Ideographic Game Engine (NUEVO - Nivel 3)
  # ============================================================

  # IDE-001 → BPO (consulta procesos del paciente para generar juegos)
  - source: IDE-001
    target: BPO-001
    type: "depends_on"

  # IDE-001 → BPG (lee el grafo de procesos del paciente)
  - source: IDE-001
    target: BPG-001
    type: "depends_on"

  # IDE-001 → BERL (se integra con el motor de ejercicios)
  - source: IDE-001
    target: BERL-001
    type: "depends_on"

  # ============================================================
  # Change `landing-ia-atencion` — AI-007 Support Chat (NUEVO)
  # ============================================================

  # AI-007 → AI-001 (corre sobre el runtime on-device Gemma + MediaPipe)
  - source: AI-007
    target: AI-001
    type: "depends_on"

  # AI-007 → AI-004 (cumple todos los guardrails clínicos y de seguridad)
  - source: AI-007
    target: AI-004
    type: "depends_on"

  # AI-007 → AI-006 (emite eventos al Event Stream)
  - source: AI-007
    target: AI-006
    type: "depends_on"

  # AI-007 → API-001 (endpoints de chat y escalación)
  - source: AI-007
    target: API-001
    type: "depends_on"

  # AI-007 → DB-001 (tablas support_tickets y consent_log)
  - source: AI-007
    target: DB-001
    type: "depends_on"

  # AI-007 → SLS-001 (el widget de soporte vive en la landing)
  - source: AI-007
    target: SLS-001
    type: "depends_on"

  # SLS-001 → AI-007 (la landing aloja el widget del support chat)
  - source: SLS-001
    target: AI-007
    type: "depends_on"

  # ============================================================
  # Build Roadmap (NUEVO) — BRD-001/IDX-007
  # ============================================================

