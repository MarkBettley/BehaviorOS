# ------------------------------------------------------------
# VALIDACIONES AUTOMÁTICAS (Para el CI/CD y el BQAS)
# ------------------------------------------------------------
validation_rules:
  - rule: "El BCMS debe administrar el ciclo clínico completo sin pérdida de datos entre etapas."
    check: "Las pruebas de integración verifican que cada paso alimente al siguiente."
  - rule: "Las notas clínicas deben cumplir con el estándar SOAP, DAP o BIRP."
    check: "El validador verifica la estructura de las notas."
  - rule: "La videoterapia debe encriptar el audio y video en tránsito."
    check: "Las pruebas de seguridad verifican el cifrado de la videollamada."
  - rule: "El BCIE debe priorizar pacientes diariamente sin intervención manual."
    check: "Las pruebas verifican la actualización diaria del Priority Engine."
  - rule: "El BSI nunca debe agendar automáticamente; solo debe sugerir."
    check: "Las pruebas verifican que BSI solo genera recomendaciones, no acciones."
  - rule: "El BCOE no debe acceder al contenido clínico (formulaciones, procesos, hipótesis)."
    check: "Las pruebas de aislamiento verifican que BCOE solo acceda a datos operativos."
  - rule: "La separación clínico-operativo debe mantenerse en todas las capas."
    check: "El validador verifica que no haya dependencias circulares entre Clinical Core y Operations Core."
  - rule: "El Automation Studio debe validar que los workflows no creen bucles infinitos."
    check: "El validador analiza los workflows en busca de dependencias circulares."
  - rule: "El Relationship Engine debe respetar los consentimientos de comunicación del paciente."
    check: "Las pruebas de integración verifican que los mensajes solo se envíen con consentimiento."
  - rule: "El BCIE debe detectar abandono con > 80% de precisión."
    check: "Las pruebas de validación clínica verifican la precisión del Dropout Prediction Engine."
  - rule: "El BSI debe responder con recomendaciones en < 300ms."
    check: "Las pruebas de rendimiento verifican el tiempo de respuesta del Smart Recommendation Engine."

