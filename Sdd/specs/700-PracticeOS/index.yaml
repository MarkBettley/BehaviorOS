# ============================================================
# BehavioralOS - Specification Driven Development
# Module: 700-PracticeOS
# Version: 2.0.0
# Status: Stable
# ============================================================
# PROPÓSITO:
# Este módulo define el Behavioral Clinical Management System
# (BCMS), el Behavioral Clinical Operating System. Gestiona
# pacientes, terapeutas, expedientes, sesiones, planes de
# tratamiento, seguimiento, documentación clínica, supervisión
# y operación diaria del consultorio o clínica.
#
# El BCMS no es un simple EMR. Es el núcleo operativo de toda
# la práctica clínica. El psicólogo nunca debería perder tiempo
# administrando información.
#
# CONTENIDO:
#   1. practice-os.md         → BCMS: ciclo clínico completo (v2.0.0)
#   2. bcms-detailed.md       → Especificación detallada de los 20 submódulos
#   3. bcie-spec.md           → BCIE: inteligencia de carga clínica
#   4. bcoe-spec.md           → BCOE: motor de operaciones del negocio
#   5. bsi-spec.md            → BSI: programación inteligente de citas
#   6. automation-studio.md   → BAS: editor visual de workflows (drag & drop)
#   7. relationship-engine.md → BRE: motor de relaciones con pacientes (CRM avanzado)
#
# IMPORTANCIA:
# El BCMS es el corazón de la práctica clínica. Sin un sistema
# operativo clínico sólido, la práctica se vuelve ineficiente y
# propensa a errores. El BCMS administra todo el ciclo de vida
# del paciente: desde la preentrevista hasta el post-alta.
# Los submódulos BCIE, BSI y BCOE potencian la inteligencia,
# la programación y las operaciones respectivamente.
# ============================================================

module:
  id: 700-PracticeOS
  name: "Behavioral Clinical Management System (BCMS)"
  version: 2.0.0
  status: Stable
  implementation_level: 2
  implementation_status: "Frozen — esperar a Nivel 1"
  owner: "Práctica Clínica & Arquitectura de Software"
  last_updated: 2026-07-14
  description: >
    Define el Behavioral Clinical Management System (BCMS),
    el Behavioral Clinical Operating System que gestiona el
    ciclo clínico completo: pacientes, terapeutas, expedientes,
    sesiones, planes de tratamiento, seguimiento, documentación
    clínica, supervisión y operación diaria. Incluye submódulos
    de inteligencia de carga (BCIE), programación inteligente
    (BSI) y operaciones del negocio (BCOE).

# ------------------------------------------------------------
# DEPENDENCIAS
# ------------------------------------------------------------
depends_on:
  - id: 000-Core
    reason: "La ontología y los principios guían la práctica clínica."
  - id: 100-Architecture
    reason: "La arquitectura define la integración del BCMS con el resto del sistema."
  - id: 200-Backend
    reason: "Las APIs, bases de datos y eventos soportan la operación clínica."
  - id: 300-Frontend
    reason: "El terapeuta interactúa con el BCMS a través de la Therapist App."
  - id: 400-AI
    reason: "La IA (TCCN, AAO) se integra con la agenda, videoterapia y notas."
  - id: 500-Experiencies
    reason: "Los ejercicios (BERL) se asignan y monitorean desde el BCMS."
  - id: 600-Commerce
    reason: "El BCE se integra para facturación y gestión de suscripciones."
  - id: 900-Security
    reason: "La seguridad y los consentimientos protegen los datos clínicos."

# ------------------------------------------------------------
# ARCHIVOS HIJOS (Especificaciones concretas)
# ------------------------------------------------------------
children:
  - id: BCMS-001
    file: practice-os.md
    title: "Behavioral Clinical Management System (BCMS)"
    description: >
      Define el Behavioral Clinical Operating System: ciclo clínico
      completo (Preentrevista → Evaluación → Formulación → Plan →
      Sesiones → Seguimiento → Alta → Post-alta), 20 submódulos
      clínicos, agenda inteligente con BSI, expediente basado en
      objetos clínicos, videoterapia con HUD y copiloto IA, notas
      clínicas SOAP/DAP/BIRP generadas por IA, CRM, supervisión,
      y documentación clínica automática. Referencia a documentos
      detallados: bcms-detailed.md, bcie-spec.md, bcoe-spec.md,
      bsi-spec.md.
    priority: P0
    estimated_read_time: 40 min
    exports:
      - "20 submódulos clínicos"
      - "Patient Registry"
      - "Therapist Workspace"
      - "Appointment Manager"
      - "Clinical Intake Manager"
      - "Assessment Manager"
      - "Clinical Record Manager"
      - "Case Formulation Manager"
      - "Treatment Plan Manager"
      - "Session Manager"
      - "Homework Manager"
      - "Progress Monitoring Manager"
      - "Clinical Timeline"
      - "Clinical Documentation Engine"
      - "Supervisor Workspace"
      - "Clinical Collaboration Layer"
      - "Notification Center"
      - "Automation Engine"
      - "Clinical Search Engine"
      - "Archive Manager"
      - "Audit Manager"

  - id: BCMS-002
    file: bcms-detailed.md
    title: "BCMS — Especificación Detallada"
    description: >
      Especificación completa de los 20 submódulos del BCMS
      con arquitectura detallada, integraciones, datos que
      maneja, y ciclo clínico completo. Incluye diferenciación
      de submódulos (BCMS vs BCIE vs BCOE vs BSI), notas de
      implementación (Event Sourcing, RBAC, Zero Trust,
      Offline-First, Multi-tenancy) y métricas de éxito.
    priority: P0
    estimated_read_time: 60 min
    exports:
      - "20 submódulos clínicos detallados"
      - "Ciclo clínico completo"
      - "Integración con el ecosistema"
      - "Notas de implementación"
      - "Métricas de éxito"

  - id: BCIE-001
    file: bcie-spec.md
    title: "Behavioral Caseload Intelligence Engine (BCIE)"
    description: >
      Motor de inteligencia para la gestión de carga clínica.
      Analiza continuamente el estado de todos los pacientes,
      prioriza el trabajo del terapeuta, identifica riesgos
      operativos y clínicos, optimiza el seguimiento y ayuda
      a distribuir eficientemente los recursos. Incluye 15
      submotores: Caseload Analyzer, Priority Engine, Risk
      Stratification, Dropout Prediction, Engagement Monitor,
      Clinical Workload Optimizer, Therapist Capacity Engine,
      Follow-up Intelligence, Waiting List Optimizer, Session
      Frequency Optimizer, Resource Allocation Engine, Clinical
      Heatmap, Productivity Analytics, Burnout Prevention,
      Caseload Dashboard. Exporta BCLI y BCoI.
    priority: P0
    estimated_read_time: 45 min
    exports:
      - "15 submotores de inteligencia de carga"
      - "BCLI (Behavioral Clinical Load Index)"
      - "BCoI (Behavioral Continuity Index)"
      - "Caseload Dashboard"

  - id: BCOE-001
    file: bcoe-spec.md
    title: "Behavioral Clinic Operations Engine (BCOE)"
    description: >
      Motor de operaciones del negocio que administra todos los
      procesos administrativos, operativos y comerciales,
      manteniendo completamente separada la gestión operativa
      del razonamiento clínico. Incluye 18 submotores: Clinic
      Administration, Resource Management, Staff Management,
      Room & Equipment, Financial Operations, Billing &
      Subscription, Payment Intelligence, Operational Workflow,
      Patient Journey, Document Management, Communication
      Center, Notification Center (operativo), Inventory,
      Operational Analytics, Multi-Branch, Compliance,
      Automation Engine (operativo), Organization Settings.
    priority: P0
    estimated_read_time: 50 min
    exports:
      - "18 submotores de operaciones del negocio"
      - "Separación Clinical Core / Operations Core"
      - "Dashboard operativo"

  - id: BSI-001
    file: bsi-spec.md
    title: "Behavioral Scheduling Intelligence (BSI)"
    description: >
      Submotor del BCIE encargado de optimizar la programación,
      continuidad y coordinación inteligente de las sesiones
      clínicas. No agenda automáticamente; sugiere y aprende.
      Incluye 16 submotores: Availability Engine, Preference
      Learning Engine, Continuity Optimizer, Session Frequency
      Engine, Smart Recommendation Engine, Cancellation
      Predictor, Rescheduling Engine, Waiting List Optimizer,
      Calendar Synchronization Layer, Reminder Intelligence,
      Attendance Prediction Engine, Scheduling Conflict
      Resolver, Multiuser Coordination Engine, Behavioral
      Routine Analyzer, Treatment Milestone Scheduler,
      Scheduling Analytics.
    priority: P0
    estimated_read_time: 50 min
    exports:
      - "16 submotores de programación inteligente"
      - "Smart Recommendation Engine"
      - "Dashboard del Paciente"
      - "Dashboard del Terapeuta"

  - id: BAS-001
    file: automation-studio.md
    title: "Behavioral Automation Studio (BAS)"
    description: >
      Define una herramienta visual de automatización de workflows
      que permite a los terapeutas y administradores crear flujos
      de trabajo automatizados sin necesidad de programación.
      Incluye un editor drag & drop, catálogo de disparadores
      y acciones, integración con BCMS, BCE, BIP y TCCN, y
      plantillas predefinidas para casos de uso comunes.
    priority: P1
    estimated_read_time: 25 min
    exports:
      - "Editor visual de workflows (drag & drop)"
      - "Catálogo de disparadores y acciones"
      - "Integración con BCMS, BCE, BIP y TCCN"
      - "Plantillas predefinidas"
      - "Gestión de workflows (activación, desactivación, historial)"

  - id: BRE-001
    file: relationship-engine.md
    title: "Behavioral Relationship Engine (BRE)"
    description: >
      Define un motor avanzado de gestión de relaciones con
      pacientes (CRM). Permite segmentar pacientes por perfil
      clínico, comportamiento y estado; gestionar interacciones;
      automatizar recordatorios personalizados; y analizar la
      evolución de la relación terapéutica. Se integra con BCMS,
      TCCN y Behavioral Twin.
    priority: P1
    estimated_read_time: 20 min
    exports:
      - "Segmentación de pacientes"
      - "Gestión de interacciones"
      - "Automatización de recordatorios"
      - "Análisis de relación terapéutica"
      - "Integración con Behavioral Twin y TCCN"

