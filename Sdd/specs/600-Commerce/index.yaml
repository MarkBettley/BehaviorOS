# ------------------------------------------------------------
# VALIDACIONES AUTOMÁTICAS (Para el CI/CD y el BQAS)
# ------------------------------------------------------------
validation_rules:
  - rule: "Los pagos deben ser idempotentes (evitar cobros duplicados)."
    check: "Las pruebas de integración verifican que cada transacción tenga un idempotency_key."
  - rule: "Las facturas CFDI deben cumplir con el estándar 4.0."
    check: "El validador verifica la estructura del XML antes del timbrado."
  - rule: "Las suscripciones deben renovarse automáticamente según el plan."
    check: "Las pruebas de integración simulan ciclos de renovación."
  - rule: "Los cupones no deben permitir descuentos que dejen el precio en cero sin autorización."
    check: "El validador verifica que el precio final sea > 0 (a menos que sea una promoción de prueba)."
  - rule: "La comisión de terapia debe ser 0% (diferenciador)."
    check: "Auditoría de transacciones verifica que no se cobra comisión por sesiones."
  - rule: "Facturación SAT incluida sin costo en planes SaaS."
    check: "Auditoría de billing verifica que Professional no factura extra por CFDI."
  - rule: "Los tokens JWT deben tener expiración y poder ser revocados."
    check: "Pruebas de LIC verifican generación, verificación y revocación."
  - rule: "La revocación de tokens debe ser efectiva en < 1 minuto."
    check: "Pruebas de integración miden latencia de Redis para revocación."
  - rule: "RBAC debe denegar accesos no autorizados."
    check: "Pruebas de permisos verifican que cada rol solo accede a sus endpoints."
  - rule: "El Website Builder debe generar sitios web accesibles (WCAG AA) y responsivos."
    check: "Las pruebas de accesibilidad y responsividad verifican los sitios generados."

