# BehavioralOS – configuración del Supabase CLI para desarrollo local
# Referencia: https://supabase.com/docs/guides/cli/config

project_id = "behavioralos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_sign_in_with_email = true
double_confirm_changes = true
enable_confirmations = true
secure_email_change_enabled = true
max_frequency = "1s"

[auth.sms]
enable_sign_in_with_sms = false
enable_confirmations = false

[edge_runtime]
enabled = false
